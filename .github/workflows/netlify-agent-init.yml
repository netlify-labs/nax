name: netlify-agent-init

on:
  pull_request:
    paths:
      - ".github/workflows/netlify-agent-init.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/netlify-agent-init/**"
      - "src/integrations/netlify/runtime.js"
      - "tests/unit/netlify-runtime.test.js"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/netlify-agent-init.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/netlify-agent-init/**"
      - "src/integrations/netlify/runtime.js"
      - "tests/unit/netlify-runtime.test.js"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - 18
          - 20
          - 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-jsdoc-types.js $(find packages/netlify-agent-init/src packages/netlify-agent-init/bin packages/netlify-agent-init/scripts -name '*.js')
      - run: npm run agent-init:ci

  ffmpeg:
    name: Real FFmpeg install (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ffmpeg --workspace netlify-agent-init

  windows-noop:
    name: Windows no-op install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node packages/netlify-agent-init/scripts/pack-smoke.js --noop-only
